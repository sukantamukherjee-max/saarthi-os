[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  publish = "dist"
  functions = "netlify/functions"

# Serve Saarthi at /saarthi
[[redirects]]
  from = "/saarthi"
  to = "/saarthi.html"
  status = 200

[[redirects]]
  from = "/saarthi/*"
  to = "/saarthi.html"
  status = 200

# SPA fallback for main app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
